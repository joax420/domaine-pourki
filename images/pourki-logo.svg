<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 160" width="380" height="160">
  <defs>
    <!-- Blue gradient for "Pourki" text matching the original -->
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5baee8"/>
      <stop offset="55%" stop-color="#2e7fc2"/>
      <stop offset="100%" stop-color="#1a5fa0"/>
    </linearGradient>
    <!-- Amber gradient for sun arc -->
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9c84a"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <!-- Orange gradient for hut -->
    <linearGradient id="hutGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d4820a"/>
    </linearGradient>
    <!-- Wave blue -->
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e7fc2"/>
      <stop offset="100%" stop-color="#5baee8"/>
    </linearGradient>
  </defs>

  <!-- SUN ARC — top right of the P, partial circle with rays -->
  <!-- Sun body (partial circle, upper right) -->
  <circle cx="198" cy="38" r="26" fill="url(#sunGrad)" opacity="0.92"/>
  <!-- Mask out lower half so it looks like a rising sun -->
  <rect x="160" y="50" width="80" height="30" fill="white" opacity="0"/>
  <!-- Sun rays -->
  <g stroke="url(#sunGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="198" y1="7" x2="198" y2="2"/>
    <line x1="217" y1="13" x2="221" y2="9"/>
    <line x1="228" y1="30" x2="233" y2="28"/>
    <line x1="174" y1="13" x2="170" y2="9"/>
    <line x1="163" y1="30" x2="158" y2="28"/>
    <line x1="224" y1="20" x2="228" y2="16"/>
    <line x1="172" y1="20" x2="168" y2="16"/>
  </g>

  <!-- "Domaine" small label above Pourki -->
  <text x="74" y="52" font-family="'Trebuchet MS', Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="1" fill="#4a8fc4" opacity="0.85">Domaine</text>

  <!-- "Pourki" large — blue gradient, slightly italic feel -->
  <text x="18" y="118" font-family="'Arial Rounded MT Bold', 'Arial Black', Arial, sans-serif" font-size="78" font-weight="900" fill="url(#blueGrad)" letter-spacing="-1">Pourki</text>

  <!-- WAVE under the text -->
  <path d="M18 132 Q50 124 82 132 Q114 140 146 132 Q178 124 210 132 Q242 140 270 132" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- HUT / CHALET ICON — right of the text, around x=278 -->
  <!-- Stilts / legs -->
  <line x1="291" y1="108" x2="291" y2="125" stroke="url(#hutGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="307" y1="108" x2="307" y2="125" stroke="url(#hutGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="323" y1="108" x2="323" y2="125" stroke="url(#hutGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Crossbeam between stilts -->
  <line x1="291" y1="118" x2="323" y2="118" stroke="url(#hutGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Hut body -->
  <rect x="284" y="82" width="46" height="28" rx="3" fill="url(#hutGrad)" opacity="0.15" stroke="url(#hutGrad)" stroke-width="2.2"/>
  <!-- Hut roof (triangle) -->
  <polygon points="280,83 307,60 334,83" fill="none" stroke="url(#hutGrad)" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Roof ridge line -->
  <line x1="280" y1="83" x2="334" y2="83" stroke="url(#hutGrad)" stroke-width="1.5"/>
  <!-- Door -->
  <rect x="299" y="94" width="12" height="16" rx="2" fill="none" stroke="url(#hutGrad)" stroke-width="2"/>
  <!-- Window -->
  <rect x="286" y="88" width="9" height="8" rx="1.5" fill="none" stroke="url(#hutGrad)" stroke-width="1.8"/>
  <!-- Hut wave / water below -->
  <path d="M278 127 Q292 121 307 127 Q322 133 337 127" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round"/>

</svg>
