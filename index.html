<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domaine Pourki — Escapades Halte Clubs</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden}
body{
  font-family:'Jost',sans-serif;
  background:#f5efe6;
  color:#1c1410;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  z-index:100;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1rem 2rem;
  background:rgba(20,12,8,0.9);
  backdrop-filter:blur(10px);
}
.nav-logo{
  font-family:'Playfair Display',serif;
  color:#d4a055;
}
.nav-links{
  display:flex;
  gap:1.5rem;
  list-style:none;
}
.nav-links a{
  color:#eee;
  text-decoration:none;
  font-size:0.8rem;
}
.nav-cta{
  border:1px solid #d4a055;
  padding:0.5rem 1rem;
  color:#d4a055;
  text-decoration:none;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  align-items:flex-end;
  padding:2rem;
  position:relative;
}
.hero-bg{
  position:absolute;
  inset:0;
  background:url('images/image1.jpg') center/cover no-repeat;
}
.hero-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);
}
.hero-content{
  position:relative;
  max-width:600px;
}
.hero h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(2.2rem,7vw,5rem);
  color:#fff;
}
.hero-desc{
  color:#ddd;
  margin:1rem 0;
}
.hero-btns{
  display:flex;
  gap:1rem;
  flex-wrap:wrap;
}
.btn-gold{
  background:#d4a055;
  color:#140c08;
  padding:0.8rem 1.5rem;
  text-decoration:none;
}
.btn-ghost{
  border:1px solid #fff;
  color:#fff;
  padding:0.8rem 1.5rem;
  text-decoration:none;
}

/* VIDEOS */
.videos{
  padding:4rem 1.5rem;
  background:#0f0805;
}
.videos-header{
  text-align:center;
  margin-bottom:2rem;
}
.videos-header h2{
  color:#fff;
  font-family:'Playfair Display',serif;
}
.videos-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1.5rem;
  max-width:1100px;
  margin:auto;
}
.video-card{
  background:#1a0f08;
  border-radius:12px;
  overflow:hidden;
}
.video-wrap{
  position:relative;
  padding-bottom:56.25%;
}
.video-wrap video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}
.video-info{
  padding:1rem;
  color:#eee;
}

/* MOBILE FIXES */
@media(max-width:900px){
  .nav-links{display:none;}
  .hero{padding:1.5rem;}
  .videos-grid{grid-template-columns:1fr;}
}
@media(max-width:500px){
  .hero h1{font-size:2rem;}
  .hero-desc{font-size:0.9rem;}
  .btn-gold,.btn-ghost{
    width:100%;
    text-align:center;
  }
}

/* =========================
   ADDED GLOBAL FIXES
========================= */

html, body {
  overflow-x: hidden;
  max-width: 100%;
}

* {
  max-width: 100%;
}

section, div, img, video {
  max-width: 100%;
}

.container, .wrapper, .content {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding-left: 2rem;
  padding-right: 2rem;
}

.hero {
  padding-left: 2rem !important;
  padding-right: 2rem !important;
}

.videos-grid,
.grid,
.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2rem;
}

nav {
  width: 100%;
}

/* MOBILE ADDITIONS */
@media (max-width: 900px) {

  .videos-grid,
  .grid,
  .cards {
    grid-template-columns: 1fr !important;
  }

  .container,
  .wrapper,
  .content,
  .hero {
    padding-left: 1.2rem !important;
    padding-right: 1.2rem !important;
  }

  h1 {
    font-size: clamp(2rem, 6vw, 3rem) !important;
  }

  h2 {
    font-size: 1.6rem !important;
  }

  p {
    font-size: 0.95rem;
  }

  .hero-btns,
  .buttons {
    flex-direction: column;
  }

  .btn,
  .btn-gold,
  .btn-ghost {
    width: 100%;
    text-align: center;
  }

  .nav-links {
    display: none;
  }
}

@media (max-width: 500px) {

  .container,
  .wrapper,
  .content,
  .hero {
    padding-left: 1rem !important;
    padding-right: 1rem !important;
  }

  h1 {
    font-size: 1.8rem !important;
  }
}
</style>
</head>

<body>

<nav>
  <div class="nav-logo">Pourki</div>
  <ul class="nav-links">
    <li><a href="#">Accueil</a></li>
    <li><a href="#">Expériences</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
  <a href="#" class="nav-cta">Réserver</a>
</nav>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <h1>Domaine <em>Pourki</em></h1>
    <p class="hero-desc">Escapades exclusives, luxe discret, expériences inoubliables.</p>

    <div class="hero-btns">
      <a href="#" class="btn-gold">Découvrir</a>
      <a href="#" class="btn-ghost">Explorer</a>
    </div>
  </div>
</section>

<section class="videos">
  <div class="videos-header">
    <h2>Expériences</h2>
  </div>

  <div class="videos-grid">
    <div class="video-card">
      <div class="video-wrap">
        <video src="video1.mp4" autoplay muted loop></video>
      </div>
      <div class="video-info">Expérience 1</div>
    </div>

    <div class="video-card">
      <div class="video-wrap">
        <video src="video2.mp4" autoplay muted loop></video>
      </div>
      <div class="video-info">Expérience 2</div>
    </div>
  </div>
</section>

</body>
</html>
